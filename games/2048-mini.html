<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048 Mini</title><style>body{margin:0;background:#111318;color:#eee;font-family:Arial;display:grid;place-items:center;min-height:100vh}.wrap{width:min(92vw,420px)}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#292c35;padding:8px;border-radius:12px}.cell{aspect-ratio:1;background:#3a3e49;border-radius:8px;display:grid;place-items:center;font-size:28px;font-weight:800}.bar{display:flex;justify-content:space-between;align-items:center}.score{background:#292c35;padding:8px 12px;border-radius:9px}</style></head><body><div class="wrap"><div class="bar"><h1>2048 Mini</h1><div class="score">Score <b id=s>0</b></div></div><div class=board id=b></div><p>Use arrow keys or WASD. Combine equal numbers.</p></div><script>let a=Array(16).fill(0),score=0;const b=document.querySelector('#b');function add(){let z=a.map((v,i)=>v?null:i).filter(v=>v!==null);if(z.length){a[z[Math.floor(Math.random()*z.length)]]=Math.random()<.9?2:4}}function draw(){b.innerHTML='';a.forEach(v=>{let e=document.createElement('div');e.className='cell';e.textContent=v||'';b.appendChild(e)});document.querySelector('#s').textContent=score}function move(dir){let old=a.join();let lines=[];for(let r=0;r<4;r++)lines.push(a.slice(r*4,r*4+4));if(dir==='up'||dir==='down'){let n=Array(4).fill(0).map(()=>[]);for(let c=0;c<4;c++)for(let r=0;r<4;r++)n[c].push(a[r*4+c]);lines=n}lines=lines.map((l)=>{if(dir==='right'||dir==='down')l.reverse();l=l.filter(Boolean);for(let i=0;i<l.length-1;i++)if(l[i]===l[i+1]){l[i]*=2;score+=l[i];l[i+1]=0}l=l.filter(Boolean);while(l.length<4)l.push(0);if(dir==='right'||dir==='down')l.reverse();return l});if(dir==='left'||dir==='right')a=lines.flat();else{a=Array(16).fill(0);for(let c=0;c<4;c++)for(let r=0;r<4;r++)a[r*4+c]=lines[c][r]}if(a.join()!==old)add();draw()}add();add();draw();addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown','a','d','w','s'].includes(k)){e.preventDefault();move(k==='a'||k==='arrowleft'?'left':k==='d'||k==='arrowright'?'right':k==='w'||k==='arrowup'?'up':'down')}})</script></body></html>
