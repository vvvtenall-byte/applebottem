<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Click</title><style>html,body{margin:0;height:100%;background:#070911;color:#fff;font-family:Arial;overflow:hidden}#target{position:absolute;width:72px;height:72px;border-radius:50%;background:#ff3355;box-shadow:0 0 20px #ff3355,0 0 60px #ff3355;cursor:pointer}#ui{position:fixed;top:18px;left:18px;font-weight:bold}#start{position:fixed;inset:0;display:grid;place-items:center;background:#070911}button{padding:14px 20px;border:0;border-radius:12px;background:#ff3355;color:#fff;font-weight:bold;cursor:pointer}</style></head><body><div id="ui">Score: <span id="score">0</span> | Time: <span id="time">20</span></div><div id="start"><button>START NEON CLICK</button></div><div id="target" style="display:none"></div><script>const t=document.querySelector('#target'),st=document.querySelector('#start'),sc=document.querySelector('#score'),tm=document.querySelector('#time');let score=0,time=20,run=false,iv;function move(){t.style.left=Math.max(10,Math.random()*(innerWidth-90))+'px';t.style.top=Math.max(60,Math.random()*(innerHeight-90))+'px'}t.onclick=()=>{if(!run)return;score++;sc.textContent=score;move()};st.onclick=()=>{run=true;st.style.display='none';t.style.display='block';move();iv=setInterval(()=>{time--;tm.textContent=time;if(time<=0){clearInterval(iv);run=false;t.style.display='none';st.innerHTML='<h2>Score: '+score+'</h2><button onclick="location.reload()">PLAY AGAIN</button>';st.style.display='grid'}},1000)}</script></body></html>
