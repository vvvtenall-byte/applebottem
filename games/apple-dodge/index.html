<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apple Dodge</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#090b12;color:white;font-family:Arial}canvas{display:block;width:100%;height:100%}#ui{position:fixed;top:15px;left:15px;font-weight:700;text-shadow:0 2px 8px #000}</style></head><body><div id="ui">Score: <span id="s">0</span> • Move: A/D or ←/→</div><canvas id="c"></canvas><script>const c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#s');let w,h,p,objs=[],score=0,keys={};function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);w=innerWidth;h=innerHeight;p={x:w/2,y:h-70,r:24}}addEventListener('resize',resize);resize();addEventListener('keydown',e=>keys[e.key]=1);addEventListener('keyup',e=>keys[e.key]=0);function loop(t){x.clearRect(0,0,w,h);x.fillStyle='#101522';x.fillRect(0,0,w,h);if(keys.ArrowLeft||keys.a)p.x-=7;if(keys.ArrowRight||keys.d)p.x+=7;p.x=Math.max(25,Math.min(w-25,p.x));if(Math.random()<.035)objs.push({x:25+Math.random()*(w-50),y:-30,r:15+Math.random()*14,v:3+Math.random()*3});for(const o of objs){o.y+=o.v;x.font=o.r*1.8+'px serif';x.textAlign='center';x.fillText('🍎',o.x,o.y);if(Math.hypot(o.x-p.x,o.y-p.y)<o.r+p.r){alert('Game over! Score: '+score);location.reload()}}objs=objs.filter(o=>o.y<h+40);x.font='48px serif';x.textAlign='center';x.fillText('🧑',p.x,p.y);score=Math.floor(t/100);s.textContent=score;requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
