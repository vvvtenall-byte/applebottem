<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Grid</title><style>body{margin:0;background:#0b0d13;color:#fff;font-family:Arial;display:grid;place-items:center;min-height:100vh}.wrap{text-align:center}.grid{display:grid;grid-template-columns:repeat(4,82px);gap:10px;margin-top:20px}.c{height:82px;border:1px solid #303541;background:#171a22;border-radius:12px;display:grid;place-items:center;font-size:34px;cursor:pointer}.c.open{background:#272b36}.info{color:#9298a5}</style></head><body><div class="wrap"><h1>Memory Grid</h1><div class="info">Moves: <span id="m">0</span></div><div class="grid" id="g"></div></div><script>const vals=['🍎','🍋','🍇','🍒','⭐','🌙','🔥','🎮'];let deck=[...vals,...vals].sort(()=>Math.random()-.5),grid=document.querySelector('#g'),moves=0,first=null,lock=false,matched=0;deck.forEach(v=>{const b=document.createElement('button');b.className='c';b.dataset.v=v;b.textContent='?';b.onclick=()=>{if(lock||b.classList.contains('open'))return;b.classList.add('open');b.textContent=v;if(!first){first=b;return}moves++;document.querySelector('#m').textContent=moves;if(first.dataset.v===b.dataset.v){matched++;first=null;if(matched===vals.length)setTimeout(()=>alert('You won in '+moves+' moves!'),200)}else{lock=true;setTimeout(()=>{first.classList.remove('open');first.textContent='?';b.classList.remove('open');b.textContent='?';first=null;lock=false},650)}};grid.appendChild(b)})</script></body></html>
