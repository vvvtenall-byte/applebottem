<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLEBOTTOM UBG</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <aside class="sidebar">

        <div class="brand">
            <img src="apple-logo.png" alt="Applebottom">
            <span>APPLEBOTTOM<br>UBG</span>
        </div>

        <nav>
            <button class="nav active" data-page="home">
                🏠
                <span>Home</span>
            </button>

            <button class="nav" data-page="games">
                🎮
                <span>Games</span>
            </button>

            <button class="nav" data-page="search">
                🔍
                <span>Search</span>
            </button>
        </nav>

        <button class="settings-link" id="settingsBtn">
            ⚙️
            <span>Settings</span>
        </button>

    </aside>


    <main>

        <header>
            <div>
                Home
                <em>252</em>
            </div>

            <div class="top-actions">
                <span id="clock"></span>
                <button>⌕</button>
                <button>☼</button>
                <button>⚙</button>
            </div>
        </header>


        <!-- HOME -->

        <section id="home" class="page active-page">

            <div class="hero">

                <img
                    src="apple-logo.png"
                    class="hero-logo"
                    alt="Applebottom logo"
                >

                <h1>APPLEBOTTOM</h1>

                <p>
                    Your calm gaming website of the internet.
                </p>

                <div id="date"></div>

                <button
                    class="search-pill"
                    id="heroSearch"
                >
                    🔍
                    <span>Search games...</span>
                </button>

                <button
                    class="browse"
                    id="browse"
                >
                    Browse all games →
                </button>

            </div>


            <h2>RECENTLY ADDED</h2>

            <div
                id="recent"
                class="grid recent"
            ></div>


            <h2>ALL GAMES</h2>

            <div
                id="all"
                class="grid"
            ></div>

        </section>


        <!-- GAMES -->

        <section
            id="games"
            class="page"
        >

            <div class="banner">

                <div>
                    <small>NEW TO APPLEBOTTOM</small>

                    <strong>Welcome</strong>

                    <p>
                        Browse the latest additions to the collection.
                    </p>
                </div>

                <img
                    src="apple-logo.png"
                    alt="Apple"
                >

            </div>


            <h2>ALL GAMES</h2>

            <div
                id="gamesGrid"
                class="grid"
            ></div>

        </section>


        <!-- SEARCH -->

        <section
            id="searchPage"
            class="page"
        >

            <div class="searchbox">

                🔍

                <input
                    id="searchInput"
                    placeholder="Search games..."
                    autocomplete="off"
                >

                <kbd>ESC</kbd>

            </div>

            <div id="results"></div>

        </section>

    </main>


    <!-- SETTINGS -->

    <div id="shade">

        <div class="drawer">

            <div class="drawhead">

                <b>Settings</b>

                <button id="closeSettings">
                    ×
                </button>

            </div>


            <label>Tab name</label>

            <input
                id="tabName"
                value="APPLEBOTTOM UBG"
            >


            <label>Accent color</label>

            <div class="swatches">

                <button data-c="#ff3b45"></button>
                <button data-c="#ff6b81"></button>
                <button data-c="#9b6cff"></button>
                <button data-c="#4aa8ff"></button>
                <button data-c="#50c878"></button>

            </div>


            <label>Card size</label>

            <div class="sizes">

                <button data-s="small">
                    Small
                </button>

                <button
                    data-s="medium"
                    class="selected"
                >
                    Medium
                </button>

                <button data-s="large">
                    Large
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
